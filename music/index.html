    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #7e7eff;
            --secondary: #ff7eb3;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #a0a0c0;
            --lighter: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(135deg, var(--dark), var(--darker));
            color: #fff;
            min-height: 100vh;
            padding-bottom: 80px; /* Место для мини-плеера */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: var(--lighter);
            color: white;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        .search-input::placeholder {
            color: var(--light);
        }

        .search-input:focus {
            outline: 2px solid var(--primary);
        }

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .tracks-count {
            color: var(--light);
            font-size: 0.9rem;
        }

        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .track-card {
            background: var(--lighter);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .track-card:hover {
            transform: translateY(-5px);
            background: rgba(126, 126, 255, 0.2);
        }

        .track-card.active {
            background: rgba(126, 126, 255, 0.3);
            outline: 2px solid var(--primary);
        }

        .track-cover {
            width: 100%;
            aspect-ratio: 1/1;
            background: var(--darker);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--primary);
        }

        .track-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-info {
            padding: 15px;
        }

        .track-name {
            font-size: 1.1rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: var(--light);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Мини-плеер */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--lighter);
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        
        html.dark .mini-player{
            background: var(--dark-bg);
        }
        html.light .mini-player{
            background: var(--light-bg);
        }

        .mini-player.active {
            transform: translateY(0);
        }

        .mini-player-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            max-width: 300px;
        }

        .mini-cover {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: var(--darker);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .mini-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .mini-track-info {
            flex: 1;
            overflow: hidden;
        }

        .mini-track-name {
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-track-artist {
            color: var(--light);
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            justify-content: center;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: none !important;
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
        }

        .control-btn:hover {
            background: var(--lighter);
        }

        .play-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            width: 45px;
            height: 45px;
            background: none !important;
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .mini-player-progress {
            flex: 1;
            max-width: 300px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--lighter);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }

        .time {
            font-size: 0.8rem;
            color: var(--light);
            min-width: 40px;
        }

        /* Полноэкранный плеер */
        .full-player {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s;
            overflow-y: auto;
        }

        html.dark .full-player{
            background: var(--dark-bg);
        }
        html.light .full-player{
            background: var(--light-bg);
        }

        .full-player.active {
            transform: translateY(0);
        }

        .full-player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--lighter);
        }

        .full-player-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        .full-cover {
            width: 300px;
            height: 300px;
            border-radius: 20px;
            background: var(--darker);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--primary);
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .full-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        .full-track-info {
            width:100%;
            margin-bottom: 30px;
            display: flexbox;
            justify-items: center;
        }

        .full-track-name {
            width:100%;
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .full-track-artist {
            width:100%;
            font-size: 1.2rem;
            color: var(--light);
        }

        .full-progress-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .full-progress-bar {
            height: 6px;
            background: var(--lighter);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 10px;
            position: relative;
        }

        .full-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }

        .full-time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--light);
        }

        .full-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .full-control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: none !important;
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
        }

        .full-control-btn:hover {
            background: var(--lighter);
        }

        .full-play-btn {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
            background: none !important;
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
        }

        .full-play-btn:hover {
            transform: scale(1.05);
        }

        .full-volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 200px;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 5px;
            background: var(--lighter);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: none !important;
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
        }

        .close-btn:hover {
            background: var(--lighter);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .tracks-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .mini-player-info {
                max-width: 200px;
            }

            .mini-player-progress {
                display: none;
            }

            .full-cover {
                width: 250px;
                height: 250px;
            }

            .full-track-name {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {

            .search-container {
                max-width: 100%;
            }

            .tracks-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }

            .mini-player-info {
                max-width: 150px;
            }

            .mini-player-controls {
                gap: 10px;
            }
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        /* Стилизация скроллбара */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(126, 126, 255, 0.5);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(126, 126, 255, 0.7);
        }
    </style>
</head>

                    {
                        title: "Фраер",
                        artist: "Михаил Круг",
                        src: "music/mikhail_krug_-_fraer.mp3", 
                        cover: "thumbnails/mikhail_krug_-_fraer.png",
                        duration: "2:56"
                    },
                    {
                        title: "Danika house",
                        artist: "Unhealthy zoglin",
                        src: "music/unhealthy_zoglin_-_danika_house.mp3", 
                        cover: "thumbnails/unhealthy_zoglin_-_danika_house.png",
                        duration: "5:58"
                    },
                ];
                
                // Проверяем доступность треков
                const availableTracks = [];
                
                for (const track of tracks) {
                    try {
                        // В реальном приложении здесь должна быть проверка доступности файла
                        // Для демонстрации просто добавляем все треки
                        availableTracks.push(track);
                    } catch (error) {
                        console.warn(`Трек ${track.title} недоступен:`, error);
                    }
                }
                
                tracks = availableTracks;
                filteredTracks = [...tracks];
                
                // Инициализируем интерфейс
                initializeLibrary();
                updateTracksCount();
                
            } catch (error) {
                console.error('Ошибка при загрузке музыки:', error);
                tracksGrid.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--light);">Ошибка загрузки музыки: ${error.message}</div>`;
            }
        }

        // Инициализация библиотеки
        function initializeLibrary() {
            tracksGrid.innerHTML = '';
            
            if (filteredTracks.length === 0) {
                tracksGrid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--light);">
                        <p>Треки не найдены</p>
                        <p>Попробуйте изменить поисковый запрос</p>
                    </div>
                `;
                return;
            }
            
            filteredTracks.forEach((track, index) => {
                const trackCard = document.createElement('div');
                trackCard.className = 'track-card fade-in';
                if (index === currentTrackIndex && miniPlayer.classList.contains('active')) {
                    trackCard.classList.add('active');
                }
                
                trackCard.innerHTML = `
                    <div class="track-cover">
                        ${track.cover ? `<img src="${track.cover}" alt="${track.title}">` : '🎵'}
                    </div>
                    <div class="track-info">
                        <div class="track-name">${track.title}</div>
                        <div class="track-artist">${track.artist}</div>
                    </div>
                `;
                
                trackCard.addEventListener('click', () => {
                    playTrack(index);
                });
                
                tracksGrid.appendChild(trackCard);
            });
        }

        // Обновление счетчика треков
        function updateTracksCount() {
            if (filteredTracks.length === tracks.length) {
                tracksCount.textContent = `${tracks.length} треков`;
            } else {
                tracksCount.textContent = `${filteredTracks.length} из ${tracks.length} треков`;
            }
        }

        // Воспроизведение трека
        function playTrack(index) {
            if (index < 0 || index >= filteredTracks.length) return;
            
            currentTrackIndex = index;
            const track = filteredTracks[currentTrackIndex];
            
            audioPlayer.src = track.src;
            audioPlayer.load();
            
            // Обновляем информацию о треке
            updateTrackInfo(track);
            
            // Показываем мини-плеер
            miniPlayer.classList.add('active');
            
            // Обновляем активную карточку
            document.querySelectorAll('.track-card').forEach((card, i) => {
                if (i === currentTrackIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
            
            // Воспроизводим
            playAudio();
        }

        // Обновление информации о треке
        function updateTrackInfo(track) {
            // Мини-плеер
            miniTrackName.textContent = track.title;
            miniTrackArtist.textContent = track.artist;
            
            if (track.cover) {
                miniAlbumCover.src = track.cover;
                miniAlbumCover.style.display = 'block';
                document.querySelector('.mini-cover .default-cover').style.display = 'none';
            } else {
                miniAlbumCover.style.display = 'none';
                document.querySelector('.mini-cover .default-cover').style.display = 'flex';
            }
            
            // Полноэкранный плеер
            fullTrackName.textContent = track.title;
            fullTrackArtist.textContent = track.artist;
            
            if (track.cover) {
                fullAlbumCover.src = track.cover;
                fullAlbumCover.style.display = 'block';
                document.querySelector('.full-cover .default-cover').style.display = 'none';
            } else {
                fullAlbumCover.style.display = 'none';
                document.querySelector('.full-cover .default-cover').style.display = 'flex';
            }
        }

        // Воспроизведение/пауза
        function togglePlay() {
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            audioPlayer.play().then(() => {
                isPlaying = true;
                miniPlayBtn.innerHTML = '<i>⏸</i>';
                fullPlayBtn.innerHTML = '<i>⏸</i>';
            }).catch(error => {
                console.error('Ошибка воспроизведения:', error);
                alert('Не удалось воспроизвести трек: ' + error.message);
            });
        }

        function pauseAudio() {
            audioPlayer.pause();
            isPlaying = false;
            miniPlayBtn.innerHTML = '<i>▶</i>';
            fullPlayBtn.innerHTML = '<i>▶</i>';
        }

        // Следующий трек
        function nextTrack() {
            let nextIndex;
            if (isShuffled) {
                nextIndex = Math.floor(Math.random() * filteredTracks.length);
            } else {
                nextIndex = (currentTrackIndex + 1) % filteredTracks.length;
            }
            playTrack(nextIndex);
        }

        // Предыдущий трек
        function prevTrack() {
            let prevIndex;
            if (isShuffled) {
                prevIndex = Math.floor(Math.random() * filteredTracks.length);
            } else {
                prevIndex = (currentTrackIndex - 1 + filteredTracks.length) % filteredTracks.length;
            }
            playTrack(prevIndex);
        }

        // Переключение режима повтора
        function toggleRepeat() {
            isRepeating = !isRepeating;
            fullRepeatBtn.style.color = isRepeating ? 'var(--primary)' : '#fff';
            audioPlayer.loop = isRepeating;
        }

        // Переключение режима перемешивания
        function toggleShuffle() {
            isShuffled = !isShuffled;
            fullShuffleBtn.style.color = isShuffled ? 'var(--primary)' : '#fff';
        }

        // Обновление прогресса воспроизведения
        function updateProgress() {
            const { currentTime, duration } = audioPlayer;
            const progressPercent = (currentTime / duration) * 100;
            
            // Мини-плеер
            miniProgress.style.width = `${progressPercent}%`;
            miniCurrentTime.textContent = formatTime(currentTime);
            
            if (!isNaN(duration)) {
                miniDuration.textContent = formatTime(duration);
                
                // Полноэкранный плеер
                fullProgress.style.width = `${progressPercent}%`;
                fullCurrentTime.textContent = formatTime(currentTime);
                fullDuration.textContent = formatTime(duration);
            }
        }

        // Форматирование времени (минуты:секунды)
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Установка прогресса при клике на прогресс-бар
        function setProgress(e, progressBar, progressElement) {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            
            if (!isNaN(duration)) {
                audioPlayer.currentTime = (clickX / width) * duration;
                progressElement.style.width = `${(clickX / width) * 100}%`;
            }
        }

        // Установка громкости
        function setVolume() {
            audioPlayer.volume = fullVolumeSlider.value / 100;
        }

        // Поиск треков
        function searchTracks(query) {
            const lowerQuery = query.toLowerCase();
            filteredTracks = tracks.filter(track => 
                track.title.toLowerCase().includes(lowerQuery) || 
                track.artist.toLowerCase().includes(lowerQuery)
            );
            
            initializeLibrary();
            updateTracksCount();
            
            // Сбрасываем текущий трек, если он не входит в отфильтрованный список
            if (filteredTracks.length > 0 && !filteredTracks.includes(filteredTracks[currentTrackIndex])) {
                currentTrackIndex = 0;
            }
        }

        // Открытие полноэкранного плеера
        function openFullPlayer() {
            fullPlayer.classList.add('active');
        }

        // Закрытие полноэкранного плеера
        function closeFullPlayer() {
            fullPlayer.classList.remove('active');
        }

        // Обработчики событий
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', () => {
            if (!isRepeating) {
                nextTrack();
            }
        });
        audioPlayer.addEventListener('error', (e) => {
            console.error('Ошибка аудио:', e);
            alert('Ошибка загрузки аудиофайла. Проверьте путь к файлу.');
        });

        // Мини-плеер
        miniPlayBtn.addEventListener('click', togglePlay);
        miniNextBtn.addEventListener('click', nextTrack);
        miniPrevBtn.addEventListener('click', prevTrack);
        miniProgressBar.addEventListener('click', (e) => setProgress(e, miniProgressBar, miniProgress));
        miniPlayer.addEventListener('click', openFullPlayer);

        // Полноэкранный плеер
        fullPlayBtn.addEventListener('click', togglePlay);
        fullNextBtn.addEventListener('click', nextTrack);
        fullPrevBtn.addEventListener('click', prevTrack);
        fullShuffleBtn.addEventListener('click', toggleShuffle);
        fullRepeatBtn.addEventListener('click', toggleRepeat);
        fullProgressBar.addEventListener('click', (e) => setProgress(e, fullProgressBar, fullProgress));
        fullVolumeSlider.addEventListener('input', setVolume);
        closePlayerBtn.addEventListener('click', closeFullPlayer);

        // Поиск
        searchInput.addEventListener('input', (e) => {
            searchTracks(e.target.value);
        });

        // Инициализация приложения
        loadMusic();
        setVolume();
    </script>
</body>
</html>
