<script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
<script>
    nextStyle();

    const converter = new showdown.Converter();

    async function loadArticle(){
        var contaier = document.createElement("section");

        var prevSect = document.createElement("div");
        prevSect.classList = "solidblock"
        prevSect.id = "previewSection";

        var artprev = document.createElement("img");
        artprev.src = `preview.png`;
        prevSect.appendChild(artprev);

        var header = document.createElement("h1");
        var hresponse = await fetch(`header.txt`);
        if(!hresponse.ok){
            header.innerText = "Не удалось получить заголовок";
        }
        else{
            var text = await hresponse.text();
            header.innerText = text;
        }
        prevSect.appendChild(header);
        contaier.appendChild(prevSect);

        var solidblock = document.createElement("div");
        solidblock.classList = "transparentblock";
        solidblock.id = "articleSection"
        contaier.appendChild(solidblock);
        
        var response = await fetch(`article.md`);
        if(!response.ok){
            solidblock.innerHTML = "Не удалось получить статью";
        }
        else{
            var text = await response.text();
            solidblock.innerHTML = converter.makeHtml(text);
        }


        document.getElementById("articles").appendChild(contaier);
    }

    loadArticle()

    slideInit();
    setInterval(()=>slide(),5000);

</script>
